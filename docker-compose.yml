version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: raahniti_db
    restart: always
    environment:
      POSTGRES_USER: raahniti_user
      POSTGRES_PASSWORD: raahniti_secure_password
      POSTGRES_DB: raahniti_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
